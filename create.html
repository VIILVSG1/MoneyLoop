<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MoneyLoop – Start a Fundraiser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --primary:#02a95c; --dark:#1a1a1a; --light:#f7f7f7; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;background:var(--light);color:var(--dark);}
    header{background:#fff;padding:1rem 2rem;border-bottom:1px solid #ddd;}
    nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;}
    .logo{font-size:1.4rem;font-weight:bold;color:var(--primary);}
    .nav-links a{margin-left:1.5rem;text-decoration:none;color:var(--dark);font-size:0.95rem;}
    .container{max-width:800px;margin:2rem auto;padding:2rem;background:#fff;border-radius:12px;border:1px solid #ddd;}
    h1{font-size:2rem;margin-bottom:1rem;}
    label{display:block;margin-top:1rem;margin-bottom:0.3rem;font-size:0.95rem;}
    input,select,textarea{width:100%;padding:0.7rem;border-radius:6px;border:1px solid #ccc;font-size:0.95rem;}
    textarea{min-height:140px;resize:vertical;}
    button{margin-top:1.5rem;width:100%;background:var(--primary);color:#fff;padding:0.8rem;border:none;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer;}
    footer{background:#fff;padding:2rem;margin-top:3rem;border-top:1px solid #ddd;text-align:center;font-size:0.9rem;color:#555;}
  </style>
</head>
<body>
<header>
  <nav>
    <div class="logo">MoneyLoop</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>
</header>

<div class="container">
  <h1>Start a Fundraiser</h1>
  <p>Fill in the details below to create your MoneyLoop fundraiser.</p>

  <label>Fundraiser Title</label>
  <input type="text" placeholder="e.g. Help rebuild our community hall">

  <label>Category</label>
  <select>
    <option>Medical</option>
    <option>Emergency</option>
    <option>Community</option>
    <option>Charity</option>
    <option>Education</option>
  </select>

  <label>Goal Amount (£)</label>
  <input type="number" placeholder="e.g. 5000">

  <label>Location</label>
  <input type="text" placeholder="e.g. Bishopton, Scotland">

  <label>Your Name</label>
  <input type="text" placeholder="Organiser name">

  <label>Story</label>
  <textarea placeholder="Explain why you’re fundraising, how the money will be used, and why it matters."></textarea>

  <button onclick="window.location.href='fundraiser.html'">Create Fundraiser</button>
</div>

<footer>
  © <span id="year"></span> MoneyLoop — Empowering Community Giving
</footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
