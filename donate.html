<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MoneyLoop – Donate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{--primary:#02a95c;--dark:#1a1a1a;--light:#f7f7f7;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;background:var(--light);color:var(--dark);}
    header{background:#fff;padding:1rem 2rem;border-bottom:1px solid #ddd;}
    nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;}
    .logo{font-size:1.4rem;font-weight:bold;color:var(--primary);}
    .nav-links a{margin-left:1.5rem;text-decoration:none;color:var(--dark);font-size:0.95rem;}
    .container{max-width:600px;margin:2rem auto;padding:2rem;background:#fff;border-radius:12px;border:1px solid #ddd;}
    h1{font-size:1.8rem;margin-bottom:1rem;}
    label{display:block;margin-top:1rem;margin-bottom:0.3rem;font-size:0.95rem;}
    input,select{width:100%;padding:0.7rem;border-radius:6px;border:1px solid #ccc;font-size:0.95rem;}
    .row{display:flex;gap:1rem;}
    .row>div{flex:1;}
    button{margin-top:1.5rem;width:100%;background:var(--primary);color:#fff;padding:0.8rem;border:none;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer;}
    footer{background:#fff;padding:2rem;margin-top:3rem;border-top:1px solid #ddd;text-align:center;font-size:0.9rem;color:#555;}
  </style>
</head>

<body>

<header>
  <nav>
    <div class="logo">MoneyLoop</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="create.html">Create</a>
      <a href="fundraiser.html">Fundraiser</a>
      <a href="donate.html">Donate</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </nav>
</header>

<div class="container">
  <h1>Donate to “Support Liam’s Recovery”</h1>
  <p>Complete your details to make a secure donation.</p>

  <label>Donation Amount (£)</label>
  <input type="number" placeholder="e.g. 25">

  <label>Full Name</label>
  <input type="text" placeholder="Your name">

  <label>Email Address</label>
  <input type="email" placeholder="you@example.com">

  <label>Card Number</label>
  <input type="text" placeholder="1234 1234 1234 1234">

  <div class="row">
    <div>
      <label>Expiry</label>
      <input type="text" placeholder="MM/YY">
    </div>
    <div>
      <label>CVC</label>
      <input type="text" placeholder="123">
    </div>
  </div>

  <button onclick="window.location.href='fundraiser.html'">Confirm Donation</button>
</div>

<footer>
  © <span id="year"></span> MoneyLoop — Empowering Community Giving
</footer>

<script>
  document.getElementById('year').textContent=new Date().getFullYear();
</script>

</body>
</html>
